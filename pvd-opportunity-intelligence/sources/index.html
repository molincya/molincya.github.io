<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究方法｜PVD Opportunity Intelligence</title><style>body{max-width:850px;margin:60px auto;padding:0 22px;background:#101820;color:#edf4f8;font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif}a{color:#48b7f5}</style></head><body><p><a href="../">← 返回情报首页</a></p><h1>研究方法与证据 Sources</h1><ul><li>优先核验OEM与零部件厂商公告、官方专利数据库、标准/政策原文、同行评审论文、会议主办方资料及专业行业媒体。</li><li>明确区分【来源事实】【分析判断】【待验证假设】。</li><li>同一事件的转载不重复计为多个信号；搜索摘要不能单独作为关键事实证据。</li><li>设备订单、扩产、客户验证与量产分别按其实际证据强度评级，不把技术研究直接写成采购需求。</li><li>分别评估涂层加工服务市场和设备/产线销售市场。</li></ul></body></html>
