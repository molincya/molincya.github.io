---
layout: default
---
<style>
.case-report {
  --case-text: #111;
  --case-muted: #666;
  max-width: 780px;
  margin: 34px auto 72px;
  padding: 0 22px;
  color: var(--case-text);
  background: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.85;
}
.case-report .article-content { color: var(--case-text); }
.case-report h1 { font-size: 28px; line-height: 1.45; margin: 0 0 26px; font-weight: 700; }
.case-report h2 { font-size: 22px; line-height: 1.5; margin: 42px 0 20px; font-weight: 700; }
.case-report h3 { font-size: 19px; line-height: 1.5; margin: 30px 0 14px; font-weight: 700; }
.case-report p { margin: 14px 0; }
.case-report table { width: 100%; border-collapse: collapse; margin: 18px 0 26px; font-size: 15px; }
.case-report th, .case-report td {
  padding: 12px 10px;
  border: 0;
  border-bottom: 1px solid #e5e5e5;
  text-align: left;
  vertical-align: top;
}
.case-report th { font-weight: 700; border-bottom: 1px solid #d5d5d5; }
.case-report tr:last-child td { border-bottom: 0; }
.case-report blockquote { margin: 18px 0; padding: 0 0 0 16px; border-left: 2px solid #ddd; color: #444; }
.case-report strong { font-weight: 700; }
.case-report a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 640px) {
  .case-report { margin: 22px auto 48px; padding: 0 16px; font-size: 15px; }
  .case-report h1 { font-size: 23px; }
  .case-report h2 { font-size: 20px; }
  .case-report table { font-size: 13px; }
  .case-report th, .case-report td { padding: 9px 6px; }
}
</style>
<main class="case-report">
  <article class="article-content markdown-body">
    {{ content }}
  </article>
</main>
