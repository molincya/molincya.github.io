---
layout: default
---
<style>
.case-report {
  max-width: 900px;
  margin: 28px auto 64px;
  padding: 0 24px;
  color: #171717;
  background: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.65;
}
.case-report .article-content { color: #171717; }
.case-report h1 {
  margin: 0 0 22px;
  padding: 0 0 16px;
  border-bottom: 1px solid #d8d8d8;
  font-size: 25px;
  line-height: 1.4;
  font-weight: 700;
}
.case-report h2 {
  margin: 34px 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid #dedede;
  font-size: 19px;
  line-height: 1.45;
  font-weight: 700;
}
.case-report h3 {
  margin: 24px 0 10px;
  font-size: 16px;
  line-height: 1.45;
  font-weight: 700;
}
.case-report p { margin: 9px 0 12px; }
.case-report ul, .case-report ol { margin: 8px 0 14px; padding-left: 22px; }
.case-report li { margin: 4px 0; }
.case-report table {
  width: 100%;
  margin: 12px 0 20px;
  border-collapse: collapse;
  font-size: 14px;
}
.case-report th, .case-report td {
  padding: 9px 10px;
  border: 0;
  border-bottom: 1px solid #e7e7e7;
  text-align: left;
  vertical-align: top;
}
.case-report th {
  color: #333;
  font-weight: 700;
  border-bottom: 1px solid #cfcfcf;
  white-space: nowrap;
}
.case-report tr:last-child td { border-bottom: 0; }
.case-report strong { font-weight: 700; }
.case-report small { color: #666; font-size: 12px; }
.case-report a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.case-report hr { border: 0; border-top: 1px solid #e5e5e5; margin: 22px 0; }
@media (max-width: 640px) {
  .case-report { margin: 18px auto 40px; padding: 0 14px; font-size: 14px; }
  .case-report h1 { font-size: 21px; }
  .case-report h2 { margin-top: 28px; font-size: 18px; }
  .case-report table { font-size: 12px; }
  .case-report th, .case-report td { padding: 7px 5px; }
}
</style>
<main class="case-report">
  <article class="article-content markdown-body">
    {{ content }}
  </article>
</main>
